<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <defs>
    <clipPath id="frame">
      <rect x="32" y="32" width="192" height="192" rx="0"/>
    </clipPath>
  </defs>

  <!-- Subtle construction grid -->
  <g opacity="0.06">
    <line x1="64" y1="32" x2="64" y2="224" stroke="#c9a24b" stroke-width="0.5"/>
    <line x1="128" y1="32" x2="128" y2="224" stroke="#c9a24b" stroke-width="0.5"/>
    <line x1="192" y1="32" x2="192" y2="224" stroke="#c9a24b" stroke-width="0.5"/>
    <line x1="32" y1="64" x2="224" y2="64" stroke="#c9a24b" stroke-width="0.5"/>
    <line x1="32" y1="128" x2="224" y2="128" stroke="#c9a24b" stroke-width="0.5"/>
    <line x1="32" y1="192" x2="224" y2="192" stroke="#c9a24b" stroke-width="0.5"/>
    <!-- Construction circle -->
    <circle cx="128" cy="128" r="88" stroke="#c9a24b" stroke-width="0.5"/>
    <circle cx="128" cy="128" r="72" stroke="#c9a24b" stroke-width="0.5"/>
  </g>

  <!-- C arc - left side, wrapping from 7 o'clock to 11 o'clock -->
  <path d="M 48 72 A 88 88 0 0 1 48 184"
        stroke="#c9a24b" stroke-width="36" stroke-linecap="round" fill="none"/>

  <!-- K vertical stem -->
  <rect x="104" y="28" width="36" height="200" rx="1" fill="#c9a24b"/>

  <!-- K upper arm - architectural stepped diagonal -->
  <polygon points="140,28 216,28 216,64 140,68" fill="#c9a24b"/>

  <!-- K lower arm -->
  <polygon points="140,188 216,188 216,228 140,228" fill="#c9a24b"/>

  <!-- Indigo accent dot at the geometric center of the C arc -->
  <circle cx="128" cy="128" r="8" fill="#5865f2" opacity="0.7"/>
</svg>
